name: buildjobs
description: HomeCheck — reseñas y directorio de profesionales del hogar.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  flutter_dotenv: ^5.2.1
  image_picker: ^1.1.2
  file_picker: ^8.1.6
  intl_phone_field: ^3.2.0
  phone_numbers_parser: ^9.0.23
  image: ^4.5.4
  url_launcher: ^6.3.2
  geolocator: ^14.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env
